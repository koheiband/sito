<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KŌHEI</title>
  <meta name="description" content="KŌHEI: noise rock nato ai piedi dell'Etna. Musica, date live, video, merch e contatti.">
  <link rel="canonical" href="https://kohei.it/">
  <link rel="alternate" hreflang="it" href="https://kohei.it/">
  <link rel="alternate" hreflang="en" href="https://kohei.it/?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://kohei.it/">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Twitter Card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KŌHEI">
  <meta property="og:title" content="KŌHEI">
  <meta property="og:description" content="Noise rock dall'Etna. Musica, live, video, merch.">
  <meta property="og:url" content="https://kohei.it/">
  <meta property="og:image" content="https://kohei.it/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Illustrazione in bianco e nero di KŌHEI">
  <meta property="og:locale" content="it_IT">
  <meta property="og:locale:alternate" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KŌHEI">
  <meta name="twitter:description" content="Noise rock dall'Etna. Musica, live, video, merch.">
  <meta name="twitter:image" content="https://kohei.it/assets/img/og-image.jpg">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/img/icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preload" href="assets/fonts/futura-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/img/cover-everything-looks-real-1200.webp" as="image" type="image/webp"
        imagesrcset="assets/img/cover-everything-looks-real-600.webp 600w, assets/img/cover-everything-looks-real-1200.webp 1200w"
        imagesizes="(min-width: 1100px) 64rem, 92vw">
  <link rel="preload" href="assets/img/logo-kohei.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "KŌHEI",
    "url": "https://kohei.it/",
    "genre": "Noise rock",
    "image": "https://kohei.it/assets/img/og-image.jpg",
    "email": "band.kohei@gmail.com",
    "sameAs": [
      "https://www.instagram.com/kohei.band/",
      "https://kohei.bandcamp.com"
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Vai al contenuto</a>

  <!-- ============ HEADER ============ -->
  <header class="site-header" id="top">
    <a class="brand brand--home" href="#top" aria-label="KŌHEI — home">
            <span class="logo" aria-hidden="true"></span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"
            data-i18n-attr="aria-label:nav.open" aria-label="Apri menu">
      <span class="menu-toggle__bar"></span>
      <span class="menu-toggle__bar"></span>
    </button>

    <nav class="site-nav" id="site-nav" data-i18n-attr="aria-label:nav.label" aria-label="Menu principale">
      <ul>
        <li><a href="#video" data-i18n="nav.video">Video</a></li>
        <li><a href="#musica" data-i18n="nav.music">Musica</a></li>
        <li><a href="#live" data-i18n="nav.live">Live</a></li>
        <li><a href="#merch" data-i18n="nav.merch">Merch</a></li>
        <li><a href="#contatti" data-i18n="nav.contact">Contatti</a></li>
      </ul>
      <button class="lang-switch" type="button" data-lang-toggle
              data-i18n-attr="aria-label:lang.switch" aria-label="Switch to English">
        <span data-lang="it">IT</span><span aria-hidden="true">/</span><span data-lang="en">EN</span>
      </button>
    </nav>
  </header>

  <main id="main">
    <!-- ============ HERO ============ -->
    <!-- Layout: logo grande a tutta larghezza del blocco, sotto la copertina
         dell'album alla stessa larghezza, su fondo nero. -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__inner">
        <h1 class="hero__title" id="hero-title">
          <span class="visually-hidden">KŌHEI</span>
          <span class="logo" aria-hidden="true"></span>
        </h1>
        <figure class="hero__cover">
          <!-- [FOTO_HERO]: copertina di Everything Looks Real -->
          <img src="assets/img/cover-everything-looks-real-1200.webp"
               srcset="assets/img/cover-everything-looks-real-600.webp 600w, assets/img/cover-everything-looks-real-1200.webp 1200w"
               sizes="(min-width: 1100px) 64rem, 92vw"
               width="1200" height="1200" fetchpriority="high"
               alt="" data-i18n-attr="alt:hero.alt">
        </figure>
        <a class="btn btn--invert" id="featured-link" href="#musica"></a>
      </div>
    </section>

    <!-- ============ VIDEO ============ -->
    <!-- Un solo video a tutta larghezza della pagina. -->
    <section class="section section--black video-section" id="video" aria-labelledby="video-title">
      <div class="container">
        <h2 class="section-title" id="video-title" data-i18n="video.title">Video</h2>
      </div>
      <div class="videos videos--full" id="videos"></div>
      <div class="container">
        <p class="small-print" data-i18n="video.notice"></p>
      </div>
    </section>

    <!-- ============ BIO ============ -->
    <section class="section section--paper bio" id="bio" aria-labelledby="bio-title">
      <div class="container bio__grid">
        <h2 class="section-title" id="bio-title" data-i18n="bio.title">Bio</h2>
        <p class="bio__text" data-i18n="bio.text"></p>
      </div>
    </section>

    <!-- ============ MUSICA ============ -->
    <section class="section section--paper" id="musica" aria-labelledby="music-title">
      <div class="container">
        <h2 class="section-title" id="music-title" data-i18n="music.title">Musica</h2>
        <div class="releases" id="releases"></div>
      </div>
    </section>

    <!-- ============ LIVE ============ -->
    <section class="section section--black" id="live" aria-labelledby="live-title">
      <div class="container">
        <h2 class="section-title" id="live-title" data-i18n="live.title">Live</h2>
        <ol class="shows" id="shows-upcoming"></ol>
        <p class="shows-empty" id="shows-empty" hidden data-i18n="live.empty"></p>
        <details class="shows-archive" id="shows-archive" hidden>
          <summary data-i18n="live.past">Date passate</summary>
          <ol class="shows shows--past" id="shows-past"></ol>
        </details>
      </div>
    </section>

    <!-- ============ MERCH ============ -->
    <section class="section section--paper" id="merch" aria-labelledby="merch-title">
      <div class="container merch">
        <div class="merch__media">
          <img id="merch-img" src="" alt="" width="1200" height="1200" loading="lazy" decoding="async">
        </div>
        <div class="merch__body">
          <h2 class="section-title" id="merch-title" data-i18n="merch.title">Merch</h2>
          <p data-i18n="merch.text"></p>
          <a class="btn btn--solid" id="merch-link" href="#" target="_blank" rel="noopener">
            <span data-i18n="merch.cta">Vai allo store</span>
            <span class="visually-hidden" data-i18n="newTab"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- ============ NEWSLETTER (Brevo) ============ -->
    <section class="section section--paper" id="newsletter" aria-labelledby="news-title">
      <div class="container newsletter">
        <div>
          <h2 class="section-title" id="news-title" data-i18n="news.title">Newsletter</h2>
          <p data-i18n="news.text"></p>
        </div>
        <!-- Il form invia i dati direttamente a Brevo solo al clic su "Iscriviti".
             Nessuno script Brevo viene caricato sul sito. I nomi dei campi (EMAIL,
             OPT_IN, email_address_check, locale) sono quelli del modulo HTML Brevo:
             verificali nel codice generato da Brevo per il tuo modulo. -->
        <form class="news-form" id="news-form" method="post" action="#" target="_blank" novalidate>
          <label for="news-email" data-i18n="news.email">Indirizzo email</label>
          <div class="news-form__row">
            <input id="news-email" name="EMAIL" type="email" autocomplete="email" required
                   inputmode="email" spellcheck="false">
            <button class="btn btn--solid" type="submit" data-i18n="news.submit">Iscriviti</button>
          </div>
          <label class="check">
            <input type="checkbox" name="OPT_IN" value="1" required>
            <span data-i18n="news.consent"></span>
          </label>
          <a class="text-link" href="privacy.html#newsletter" data-privacy-link data-i18n="news.privacy">Informativa privacy</a>
          <!-- honeypot anti-spam di Brevo: deve restare vuoto -->
          <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" class="visually-hidden" aria-hidden="true">
          <input type="hidden" name="locale" value="it">
          <p class="form-msg" id="news-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- ============ CONTATTI ============ -->
    <section class="section section--black" id="contatti" aria-labelledby="contact-title">
      <div class="container contact">
        <h2 class="section-title" id="contact-title" data-i18n="contact.title">Contatti</h2>
        <dl class="contact__list">
          <div id="contact-emails" class="contact__emails"></div>
          <dt data-i18n="contact.follow">Seguici</dt>
          <dd><ul class="socials" id="contact-socials"></ul></dd>
        </dl>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>© <span id="year"></span> KŌHEI</p>
      <a href="privacy.html" data-privacy-link data-i18n="footer.privacy">Privacy e cookie</a>
      <a href="#top" data-i18n="footer.top">Torna su</a>
    </div>
  </footer>

  <noscript>
    <div class="noscript">
      <p>KŌHEI — <a href="https://kohei.bandcamp.com">Bandcamp</a> ·
        <a href="https://www.instagram.com/kohei.band/">Instagram</a> ·
        <a href="mailto:band.kohei@gmail.com">band.kohei@gmail.com</a> ·
        Booking: <a href="mailto:monica.m@agiantleap.info">monica.m@agiantleap.info</a></p>
    </div>
  </noscript>

  <script src="js/i18n.js" defer></script>
  <script src="js/content.js" defer></script>
  <script src="js/live.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
